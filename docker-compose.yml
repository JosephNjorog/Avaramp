# docker-compose.yml (root level)
#
# Local dev only. Backend/frontend/admin all read their real secrets from
# each app's own .env / .env.local (never committed) via env_file — this
# file only overrides the handful of values that differ inside the Docker
# network (DB/Redis hostnames, inter-service URLs).

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     avaramp
      POSTGRES_PASSWORD: avaramp_secret
      POSTGRES_DB:       avaramp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT:         "3000"
      DATABASE_URL: postgresql://avaramp:avaramp_secret@postgres:5432/avaramp
      REDIS_URL:    redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
